<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katowice 3D - Studio AI</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0b0f19; color: #f1f5f9; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: #1e1b4b; padding: 12px; text-align: center; border-bottom: 1px solid #312e81; font-weight: bold; }
        #settings { padding: 8px 12px; background: #0f172a; display: flex; gap: 8px; border-bottom: 1px solid #1e293b; }
        #settings input { flex: 1; padding: 8px; background: #1e293b; border: 1px solid #334155; color: white; border-radius: 6px; font-size: 14px; }
        #chat-container { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
        .message { padding: 10px 14px; border-radius: 10px; max-width: 90%; line-height: 1.4; font-size: 14px; }
        .user { background: #4f46e5; align-self: flex-end; color: white; }
        .ai { background: #1e293b; align-self: flex-start; border: 1px solid #334155; color: #e2e8f0; }
        #input-box { display: flex; padding: 10px; background: #0f172a; border-top: 1px solid #1e293b; gap: 8px; }
        #input-box textarea { flex: 1; padding: 10px; background: #1e293b; border: 1px solid #334155; color: white; border-radius: 6px; resize: none; height: 44px; font-size: 14px; }
        #input-box button { background: #4f46e5; color: white; border: none; padding: 0 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <header>🐾 Katowice 3D Studio</header>

    <div id="settings">
        <input type="password" id="apiKey" placeholder="Wklej klucz API (np. Agnes AI)" onchange="saveKey()">
    </div>

    <div id="chat-container">
        <div class="message ai">Cześć! Twoje studio na telefonie jest gotowe. Wklej klucz powyżej i napisz pierwszą wytyczną do uniwersum Katowic!</div>
    </div>

    <div id="input-box">
        <textarea id="userInput" placeholder="Opisz postać lub scenę..."></textarea>
        <button onclick="sendMessage()">Wyślij</button>
    </div>

    <script>
        let apiKey = localStorage.getItem('studio_key') || '';
        if(apiKey) document.getElementById('apiKey').value = apiKey;

        function saveKey() {
            apiKey = document.getElementById('apiKey').value;
            localStorage.setItem('studio_key', apiKey);
        }

        function appendMessage(text, sender) {
            const container = document.getElementById('chat-container');
            const msg = document.createElement('div');
            msg.className = `message ${sender}`;
            msg.innerText = text;
            container.appendChild(msg);
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if(!text) return;
            if(!apiKey) {
                alert('Najpierw wklej klucz API w pole na górze!');
                return;
            }

            appendMessage(text, 'user');
            input.value = '';
            appendMessage("Generuję...", "ai");

            try {
                const response = await fetch('https://api.agnes-ai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: "agnes-2.0-flash",
                        messages: [
                            { role: "system", content: "Jesteś głównym reżyserem uniwersum traktującego o psach uciekających z podziemnych Katowic pod Spodkiem. Pomagasz tworzyć postacie i scenariusze od zera." },
                            { role: "user", content: text }
                        ]
                    })
                });
                
                const data = await response.json();
                const chatContainer = document.getElementById('chat-container');
                chatContainer.removeChild(chatContainer.lastChild);
                
                const reply = data.choices[0].message.content;
                appendMessage(reply, 'ai');
            } catch (error) {
                const chatContainer = document.getElementById('chat-container');
                chatContainer.removeChild(chatContainer.lastChild);
                appendMessage("Błąd połączenia z API. Sprawdź klucz.", "ai");
            }
        }
    </script>
</body>
</html>
